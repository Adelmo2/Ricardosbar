# Perfil de desenvolvimento: banco Postgres local (stack ~/docker/ricardosbar-dev, porta 5433).
# A senha fica em .env.dev na raiz do projeto (fora do git). Rodar com:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
spring.config.import=optional:file:.env.dev[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5433/ricardosbar
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
